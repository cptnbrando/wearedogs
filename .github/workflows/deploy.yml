name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

env:
  # Deploy target. Override with repository variables (Settings → Secrets and
  # variables → Actions → Variables):
  #   SITE_MODE    live (default) | archive
  #   SITE_ORIGIN  https://dogs.red (default) | https://www.wearedogs.net
  # See scripts/vite-plugin-site-files.js for what each mode emits.
  SITE_MODE: ${{ vars.SITE_MODE || 'live' }}
  SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://dogs.red' }}

jobs:
  build-and-deploy:
    # GitHub Pages is the archive host only. The live site (YEAHDOGS/dogs.red)
    # deploys through Cloudflare Workers Builds (wrangler.jsonc), so this job
    # must not run there and create a stray gh-pages branch.
    if: github.repository == 'cptnbrando/wearedogs'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      # A broken build never reaches gh-pages: the previous deploy keeps serving.
      - name: Smoke test the build
        run: |
          test -s dist/index.html
          test -s dist/CNAME
          test -s dist/health.json
          grep -q "\"mode\": \"${SITE_MODE}\"" dist/health.json
          grep -q '<div id="app">' dist/index.html
          echo "CNAME: $(cat dist/CNAME)"
          cat dist/health.json

      # Publishes dist/ to the gh-pages branch with the gh-pages package that is
      # already a devDependency: no third-party deploy action, no Node 20
      # runtime deprecation warning. -t keeps dotfiles (.well-known).
      - name: Deploy to gh-pages branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx gh-pages -d dist -t -m "deploy: ${GITHUB_SHA::7} (${SITE_MODE})" \
            -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
