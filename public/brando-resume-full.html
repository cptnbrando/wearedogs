<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Resume — DOGS</title>
  <link rel="icon" href="/favicon.svg" />
  <style>
    /* Bare full-viewport PDF viewer. Plain CSS, no JS — runs on the Chrome 40 potato.
       Colors mirror src/styles/_variables.scss ($bg-app-dark, $color-neon-red). */
    html, body { margin: 0; height: 100%; background: #050508; color: #f5f5f5; font: 600 15px/1.2 Inter, Outfit, system-ui, sans-serif; }
    body { display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; overflow: hidden; }
    .bar { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: space-between; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    .brand { color: #ff3344; letter-spacing: 0.3em; text-decoration: none; }
    .btn { color: #050508; background: #ff3344; padding: 9px 16px; border-radius: 999px; text-decoration: none; }
    .btn:focus, .btn:hover { background: #f5f5f5; outline: none; }
    .doc { -webkit-flex: 1; flex: 1; width: 100%; border: 0; display: block; }
    /* Shown only where the browser can't draw a PDF inline (Android Chrome etc.) */
    .fallback { height: 100%; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
    .fallback p { margin: 0 0 18px; opacity: 0.7; font-weight: 400; }
    @media (min-width: 1920px) { html, body { font-size: 22px; } .bar { padding: 16px 28px; } .btn { padding: 14px 26px; } }
    @media (orientation: landscape) and (max-height: 500px) { .bar { padding: 4px 12px; } .btn { padding: 6px 14px; } }
  </style>
</head>
<body>
  <header class="bar">
    <a class="brand" href="/">DOGS</a>
    <a class="btn" href="/resume1.pdf" download>Download PDF</a>
  </header>
  <object class="doc" data="/resume1.pdf#view=FitH" type="application/pdf" aria-label="Resume">
    <div class="fallback">
      <p>This browser can't show PDFs inline.</p>
      <a class="btn" href="/resume1.pdf">Open resume</a>
    </div>
  </object>
</body>
</html>
