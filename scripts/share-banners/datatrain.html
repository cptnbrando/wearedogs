<!doctype html>
<!--
  Source artwork for the Data Train share card (public/share/datatrain.png).
  Link unfurlers reject SVG and never run a page, so this is rendered once to a
  1200x630 PNG and the PNG is what ships. To re-render after an edit, take a
  headless screenshot and crop it to the top-left 1200x630 (headless Edge's
  viewport is smaller than --window-size, so ask for a bigger window):

    msedge --headless --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1300,800 --screenshot=banner.png scripts/share-banners/datatrain.html

  Colours mirror src/styles/_datatrain-variables.scss.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Data Train banner</title>
  <style>
    :root {
      --surface: #080b0e;
      --panel: #10161b;
      --raised: #172128;
      --ink: #f0f6f8;
      --muted: #a1b4bf;
      --line: #2b3942;
      --accent: #00d9e9;
      --accent-ink: #03272b;
      --mint: #83e4be;
      --pink: #ffb6b6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(620px 380px at 88% 96%, rgba(0, 217, 233, .22), transparent 70%),
        radial-gradient(520px 320px at 4% 0%, rgba(131, 228, 190, .10), transparent 70%),
        radial-gradient(rgba(161, 180, 191, .13) 1.5px, transparent 1.6px) 0 0 / 30px 30px,
        var(--surface);
    }
    .copy { position: absolute; left: 80px; top: 62px; }
    .label {
      font-size: 22px; font-weight: 700; letter-spacing: 7px;
      color: var(--accent); text-transform: uppercase;
    }
    h1 {
      margin-top: 6px;
      font-size: 128px; line-height: 1; font-weight: 900; letter-spacing: -3px;
    }
    h1 span { color: var(--accent); }
    .tag {
      margin-top: 18px; max-width: 640px;
      font-size: 31px; line-height: 1.3; font-weight: 500; color: var(--muted);
    }
    .pill {
      position: absolute; right: 70px; top: 62px;
      padding: 12px 26px; border-radius: 999px;
      font-size: 30px; font-weight: 800; letter-spacing: .5px;
      color: var(--accent-ink); background: var(--accent);
      box-shadow: 0 0 34px rgba(0, 217, 233, .45);
    }
    svg { position: absolute; left: 0; top: 0; }
  </style>
</head>
<body>
  <div class="copy">
    <p class="label">Dogs &middot; Toolbox</p>
    <h1>DATA <span>TRAIN</span></h1>
    <p class="tag">Scan a QR code. Send files and text between your devices.</p>
  </div>
  <div class="pill">dogs.red/d</div>

  <svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <defs>
      <linearGradient id="beam" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#00d9e9" stop-opacity=".55" />
        <stop offset="1" stop-color="#00d9e9" stop-opacity="0" />
      </linearGradient>
    </defs>

    <!-- sparkles -->
    <g fill="#f0f6f8">
      <path d="M1040 190l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" opacity=".9" />
      <path d="M1120 300l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" opacity=".6" />
      <path d="M760 70l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" opacity=".5" />
      <path d="M60 470l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" opacity=".5" />
    </g>

    <!-- track -->
    <g stroke="#2b3942" stroke-width="8">
      <path d="M40 566h1120" stroke-dasharray="26 26" />
    </g>
    <path d="M0 546h1200" stroke="#a1b4bf" stroke-width="5" />

    <!-- headlight beam -->
    <path d="M1012 462l200-54v120z" fill="url(#beam)" />

    <!-- smoke, one bit per puff -->
    <g fill="#172128" stroke="#2b3942" stroke-width="3">
      <circle cx="928" cy="352" r="17" />
      <circle cx="890" cy="312" r="23" />
      <circle cx="838" cy="270" r="29" />
    </g>
    <g fill="#00d9e9" font-family="Consolas, 'Courier New', monospace" font-weight="700" text-anchor="middle">
      <text x="928" y="359" font-size="20">1</text>
      <text x="890" y="321" font-size="26">0</text>
      <text x="838" y="281" font-size="32">1</text>
    </g>

    <!-- couplers -->
    <g stroke="#a1b4bf" stroke-width="7">
      <path d="M308 486h34M498 486h34M688 486h34" />
    </g>

    <!-- car: text -->
    <g>
      <rect x="150" y="410" width="160" height="92" rx="16" fill="#10161b" stroke="#ffb6b6" stroke-width="5" />
      <g stroke="#ffb6b6" stroke-width="7">
        <path d="M184 440h92M184 458h92M184 476h54" />
      </g>
    </g>
    <!-- car: music -->
    <g>
      <rect x="340" y="410" width="160" height="92" rx="16" fill="#10161b" stroke="#83e4be" stroke-width="5" />
      <path d="M408 474v-40l36-8v40" stroke="#83e4be" stroke-width="7" />
      <circle cx="398" cy="474" r="10" fill="#83e4be" />
      <circle cx="434" cy="466" r="10" fill="#83e4be" />
    </g>
    <!-- car: photo -->
    <g>
      <rect x="530" y="410" width="160" height="92" rx="16" fill="#10161b" stroke="#00d9e9" stroke-width="5" />
      <rect x="572" y="430" width="76" height="52" rx="8" stroke="#00d9e9" stroke-width="6" />
      <circle cx="592" cy="447" r="6" fill="#00d9e9" />
      <path d="M576 478l22-20 14 12 12-10 20 18" stroke="#00d9e9" stroke-width="6" />
    </g>

    <!-- locomotive -->
    <g>
      <!-- chimney -->
      <path d="M918 432v-34h34v34z" fill="#172128" stroke="#00d9e9" stroke-width="5" />
      <path d="M908 396h54" stroke="#00d9e9" stroke-width="9" />
      <!-- boiler -->
      <path d="M818 430h152a36 36 0 0 1 36 36v36H818z" fill="#00d9e9" />
      <!-- cab -->
      <rect x="720" y="368" width="104" height="134" rx="14" fill="#00d9e9" />
      <path d="M708 368h128" stroke="#f0f6f8" stroke-width="10" />
      <rect x="738" y="388" width="68" height="52" rx="10" fill="#080b0e" />
      <!-- the driver -->
      <g>
        <ellipse cx="755" cy="420" rx="8" ry="14" fill="#a1b4bf" transform="rotate(14 755 420)" />
        <ellipse cx="789" cy="420" rx="8" ry="14" fill="#a1b4bf" transform="rotate(-14 789 420)" />
        <circle cx="772" cy="420" r="16" fill="#f0f6f8" />
        <circle cx="766" cy="416" r="2.6" fill="#080b0e" />
        <circle cx="778" cy="416" r="2.6" fill="#080b0e" />
        <ellipse cx="772" cy="424" rx="4" ry="3" fill="#080b0e" />
        <path d="M766 429q6 5 12 0" stroke="#080b0e" stroke-width="2" />
      </g>
      <!-- the engine's face -->
      <circle cx="900" cy="462" r="6" fill="#03272b" />
      <circle cx="944" cy="462" r="6" fill="#03272b" />
      <circle cx="902" cy="460" r="2" fill="#f0f6f8" />
      <circle cx="946" cy="460" r="2" fill="#f0f6f8" />
      <path d="M910 476q12 11 24 0" stroke="#03272b" stroke-width="5" />
      <ellipse cx="884" cy="478" rx="9" ry="5" fill="#ffb6b6" opacity=".85" />
      <ellipse cx="960" cy="478" rx="9" ry="5" fill="#ffb6b6" opacity=".85" />
      <!-- headlight and cowcatcher -->
      <circle cx="1004" cy="462" r="10" fill="#f0f6f8" />
      <path d="M1006 506l40 38h-40z" fill="#a1b4bf" />
    </g>

    <!-- wheels -->
    <g fill="#080b0e" stroke="#f0f6f8" stroke-width="6">
      <circle cx="190" cy="522" r="20" /><circle cx="270" cy="522" r="20" />
      <circle cx="380" cy="522" r="20" /><circle cx="460" cy="522" r="20" />
      <circle cx="570" cy="522" r="20" /><circle cx="650" cy="522" r="20" />
      <circle cx="766" cy="520" r="23" /><circle cx="862" cy="520" r="23" /><circle cx="958" cy="520" r="23" />
    </g>
    <g fill="#f0f6f8">
      <circle cx="190" cy="522" r="5" /><circle cx="270" cy="522" r="5" />
      <circle cx="380" cy="522" r="5" /><circle cx="460" cy="522" r="5" />
      <circle cx="570" cy="522" r="5" /><circle cx="650" cy="522" r="5" />
      <circle cx="766" cy="520" r="5" /><circle cx="862" cy="520" r="5" /><circle cx="958" cy="520" r="5" />
    </g>
    <path d="M766 520h192" stroke="#f0f6f8" stroke-width="6" />
  </svg>
</body>
</html>
