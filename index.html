<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#000000" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- es5-lite gate: browsers that can't run module scripts (Samsung Internet
       2.2 on Tizen TVs, Chrome < 61, 2015-era WebKit) would render a blank
       page — send them to the static, ES5-only /lite/ edition instead.
       Crawlers never execute JS, so share cards are unaffected. -->
  <script>
    (function () {
      if (!('noModule' in document.createElement('script')) &&
          location.pathname.indexOf('/lite/') !== 0) {
        location.replace('/lite/');
      }
    }());
  </script>

  <!-- Google Fonts (Inter, Outfit, Roboto Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Outfit:wght@300..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

  <!-- Basic SEO -->
  <title>DOGS</title>
  <meta name="description" content="BARKBARKBARKBARKBARKBBARKBARKBARKBARKBARKBARKBARKBBARKBARK" />
  <meta name="keywords"
    content="DOGS, Captain Brando!, We Are Dogs, Punk Rock Technology, Texas, Oklahoma, Technology, Development, Web, App, AI, Svelte, SvelteKit, Vite, Castle, Cloud, Indie Tech, Rap Project, Texas Rap, Oklahoma Rap, Big Money, Big Things" />
  <meta name="author" content="Captain Brando!" />
  <link rel="canonical" href="https://wearedogs.net" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://wearedogs.net" />
  <meta property="og:title" content="DOGS" />
  <meta property="og:description" content="BARKBARKBARKBARKBARKBBARKBARKBARKBARKBARKBARKBARKBBARKBARK" />
  <!-- og:image must be an absolute URL; crawlers can't resolve a site-root path. -->
  <meta property="og:image" content="https://wearedogs.net/android-chrome-512x512.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://wearedogs.net" />
  <meta property="twitter:title" content="DOGS" />
  <meta property="twitter:description" content="BARKBARKBARKBARKBARKBBARKBARKBARKBARKBARKBARKBARKBBARKBARK" />
  <meta property="twitter:image" content="https://wearedogs.net/android-chrome-512x512.png" />

  <!-- Deep-link restore: 404.html stashes the original path, we restore it
       here before the SPA boots so the router reads the correct pathname. -->
  <script>
    (function () {
      var r = sessionStorage.__wad_redirect;
      if (r) { sessionStorage.removeItem('__wad_redirect'); history.replaceState(null, '', r); }
    }());
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
