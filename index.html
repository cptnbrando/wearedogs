<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Google Fonts (Inter, Outfit, Roboto Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Outfit:wght@300..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

  <!-- Basic SEO -->
  <title>DOGS</title>
  <meta name="description" content="BARKBARKBARKBARKBARKBBARKBARKBARKBARKBARKBARKBARKBBARKBARK" />
  <meta name="keywords"
    content="DOGS, Captain Brando!, We Are Dogs, Punk Rock Technology, Texas, Oklahoma, Technology, Development, Web, App, AI, Svelte, SvelteKit, Vite, Castle, Cloud, Indie Tech, Rap Project, Texas Rap, Oklahoma Rap, Big Money, Big Things" />
  <meta name="author" content="Captain Brando!" />
  <!-- The canonical site is always the live one, even on the archive build. -->
  <link rel="canonical" href="%VITE_LIVE_ORIGIN%" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="%VITE_SITE_ORIGIN%" />
  <meta property="og:title" content="DOGS" />
  <meta property="og:description" content="BARKBARKBARKBARKBARKBBARKBARKBARKBARKBARKBARKBARKBBARKBARK" />
  <!-- og:image must be an absolute URL; crawlers can't resolve a site-root path. -->
  <meta property="og:image" content="%VITE_SITE_ORIGIN%/android-chrome-512x512.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="%VITE_SITE_ORIGIN%" />
  <meta property="twitter:title" content="DOGS" />
  <meta property="twitter:description" content="BARKBARKBARKBARKBARKBBARKBARKBARKBARKBARKBARKBARKBBARKBARK" />
  <meta property="twitter:image" content="%VITE_SITE_ORIGIN%/android-chrome-512x512.png" />

  <!-- Deep-link restore: 404.html stashes the original path, we restore it
       here before the SPA boots so the router reads the correct pathname. -->
  <script>
    (function () {
      var r = sessionStorage.__wad_redirect;
      if (r) { sessionStorage.removeItem('__wad_redirect'); history.replaceState(null, '', r); }
    }());
  </script>

  <!-- Archive gate (plain ES5, runs on the frozen wearedogs.net build only).
       Probes the live site's health.json; if dogs.red answers as live, the
       visitor is sent there with the same path. If it times out or fails,
       they stay on the archive, which is the whole point of keeping it.
       Skipped when the visitor opted to stay (Settings toggle, persisted) or
       arrived with ?stay (this browser session only). -->
  <script>
    (function () {
      if ('%VITE_SITE_MODE%' !== 'archive') return;
      var LIVE = '%VITE_LIVE_ORIGIN%';
      var STAY_KEY = 'wearedogs-stay-on-archive';
      var PROBE_TIMEOUT_MS = 4000;
      var host = location.hostname;
      if (host === 'localhost' || host === '127.0.0.1') return;
      try {
        if (/[?&]stay(=|&|$)/.test(location.search)) sessionStorage.setItem(STAY_KEY, '1');
        if (localStorage.getItem(STAY_KEY) === '1' || sessionStorage.getItem(STAY_KEY) === '1') return;
      } catch (e) { /* storage blocked: fall through and probe */ }

      var target = LIVE + location.pathname + location.search + location.hash;
      var settled = false;
      function stay() {
        if (settled) return;
        settled = true;
        document.documentElement.setAttribute('data-archive-fallback', '1');
      }
      var xhr = new XMLHttpRequest();
      xhr.open('GET', LIVE + '/health.json?t=' + Date.now(), true);
      xhr.timeout = PROBE_TIMEOUT_MS;
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4 || settled) return;
        if (xhr.status === 200 && /"mode"\s*:\s*"live"/.test(xhr.responseText)) {
          settled = true;
          location.replace(target);
        } else {
          stay();
        }
      };
      xhr.ontimeout = stay;
      xhr.onerror = stay;
      xhr.send();
    }());
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
