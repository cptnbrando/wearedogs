<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#000000" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Google Fonts (Inter, Outfit, Roboto Mono).
       Loaded async (print media until loaded) so the stylesheet never blocks
       first paint — Lighthouse measured it costing ~280ms of render delay.
       display=swap means text renders in the fallback font meanwhile. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Outfit:wght@300..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Outfit:wght@300..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet">
  </noscript>

  <!-- Basic SEO -->
  <title>DOGS</title>
  <meta name="description" content="BARKBARKBARKBARKBARKBBARKBARKBARKBARKBARKBARKBARKBBARKBARK" />
  <meta name="keywords"
    content="DOGS, Captain Brando!, We Are Dogs, Punk Rock Technology, Texas, Oklahoma, Technology, Development, Web, App, AI, Svelte, SvelteKit, Vite, Castle, Cloud, Indie Tech, Rap Project, Texas Rap, Oklahoma Rap, Big Money, Big Things" />
  <meta name="author" content="Captain Brando!" />
  <link rel="canonical" href="https://wearedogs.net" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://wearedogs.net" />
  <meta property="og:title" content="DOGS" />
  <meta property="og:description" content="BARKBARKBARKBARKBARKBBARKBARKBARKBARKBARKBARKBARKBBARKBARK" />
  <!-- og:image must be an absolute URL; crawlers can't resolve a site-root path. -->
  <meta property="og:image" content="https://wearedogs.net/android-chrome-512x512.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://wearedogs.net" />
  <meta property="twitter:title" content="DOGS" />
  <meta property="twitter:description" content="BARKBARKBARKBARKBARKBBARKBARKBARKBARKBARKBARKBARKBBARKBARK" />
  <meta property="twitter:image" content="https://wearedogs.net/android-chrome-512x512.png" />

  <!-- Deep-link restore + old-browser gate (strictly ES5 — checked by
       scripts/check-es5.js). 404.html stashes the original path, we restore
       it before the SPA boots so the router reads the correct pathname.
       Then: browsers that can't run the modern bundle (no Proxy, no ES
       modules, or pre-optional-chaining syntax) are routed to static pages
       that actually work — /gopro/ for GoPro deep links, /lite/ otherwise.
       On any modern browser every test passes and this is dead code. -->
  <script>
    (function () {
      var r = sessionStorage.__wad_redirect;
      if (r) { sessionStorage.removeItem('__wad_redirect'); history.replaceState(null, '', r); }

      var probe = document.createElement('script');
      var supported = typeof Proxy !== 'undefined' && ('noModule' in probe);
      if (supported) {
        // Modern syntax lives inside the string, so old parsers never see it.
        try { new Function('return null ?? [].at?.(0)'); } catch (e) { supported = false; }
      }
      if (!supported) {
        var path = location.pathname;
        if (/^\/apps\/gopro(\/|$)/.test(path)) {
          var seg = path.split('/'); // ['', 'apps', 'gopro', show?, ep?]
          location.replace('/gopro/' + (seg[3]
            ? '?show=' + seg[3] + (seg[4] ? '&ep=' + seg[4] : '')
            : ''));
        } else {
          location.replace('/lite/');
        }
      }
    }());
  </script>
</head>

<body>
  <div id="app">
    <!-- Instant boot screen: pure HTML/CSS, renders before ANY JavaScript
         on browsers from the beginning of time. Removed by main.js the
         moment the Svelte app mounts. -->
    <div id="wad-boot">
      <style>
        #wad-boot {
          position: fixed;
          top: 0; left: 0; right: 0; bottom: 0;
          background: #000;
          color: #fff;
          font-family: Arial, Helvetica, sans-serif;
          z-index: 9999;
        }
        #wad-boot .wad-boot-logo {
          /* margin-based centering: works on engines with no flex/transform */
          position: absolute;
          top: 50%;
          left: 50%;
          width: 140px;
          height: 140px;
          margin: -78px 0 0 -70px;
        }
        #wad-boot .wad-boot-info {
          position: absolute;
          left: 0;
          bottom: 16px;
          width: 100%;
          text-align: center;
          color: #888;
          font-size: 13px;
        }
        #wad-boot .wad-boot-wheel {
          display: inline-block;
          width: 14px;
          height: 14px;
          margin-right: 8px;
          vertical-align: middle;
          border: 2px solid #444;
          border-top-color: #fff;
          border-radius: 50%;
          -webkit-animation: wadspin 0.9s linear infinite;
          animation: wadspin 0.9s linear infinite;
        }
        @-webkit-keyframes wadspin { to { -webkit-transform: rotate(360deg); } }
        @keyframes wadspin { to { transform: rotate(360deg); } }
      </style>
      <img class="wad-boot-logo" src="/favicon.svg" alt="DOGS" />
      <div class="wad-boot-info">
        <span class="wad-boot-wheel"></span>Loading wearedogs.net&hellip;
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
